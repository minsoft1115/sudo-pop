[package]
name = "sudo-pop"
version = "0.1.0"
edition = "2024"
description = "GUI askpass wrapper for sudo that keeps the terminal intact"
license = "MIT"

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
libc = "0.2"
zeroize = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"       # must ship together with the askpass hardening (plan.md 4-1)
opt-level = 3
